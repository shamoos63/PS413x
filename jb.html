<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PS4 Jailbreak - TopTech</title>
<style>
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .55; }
  }
  @keyframes scan {
    0% { background-position: 0 0; }
    100% { background-position: 0 40px; }
  }
  @keyframes real-spin {
    to { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
  }
  @keyframes subtle-pulse {
    0% { -webkit-transform: scale(0.95); transform: scale(0.95); opacity: .5; }
    50% { -webkit-transform: scale(1.05); transform: scale(1.05); opacity: .8; }
    100% { -webkit-transform: scale(0.95); transform: scale(0.95); opacity: .5; }
  }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #05080c;
    color: #b8c9d4;
    font: 15px/1.5 "Consolas", "Courier New", monospace;
  }
  body {
    height: 100vh;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    pointer-events: none; z-index: 0;
    background:
      linear-gradient(rgba(0, 240, 255, .03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, .03) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  body::after {
    content: "";
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    pointer-events: none; z-index: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 0, 0, .12) 2px,
      rgba(0, 0, 0, .12) 4px
    );
    animation: scan 8s linear infinite;
  }
  #brand {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap;
    padding: 10px 16px;
    background: linear-gradient(180deg, #0a1218 0%, #070d12 100%);
    border-bottom: 1px solid #1a3a45;
    box-shadow: 0 1px 0 rgba(0, 240, 255, .15);
  }
  .brand-left { display: flex; align-items: center; }
  .brand-left img {
    width: 30px; height: 30px; border-radius: 4px;
    border: 1px solid #1a4a55;
    margin-right: 10px;
  }
  #brand b {
    font-size: 16px; font-weight: 700; letter-spacing: .22em;
    text-transform: uppercase; color: #e8f7fc;
    text-shadow: 0 0 12px rgba(0, 240, 255, .35);
  }
  .brand-right {
    display: flex; align-items: center; flex-wrap: wrap;
    font-size: 12px; letter-spacing: .04em;
  }
  .brand-right a {
    color: #5eead4; text-decoration: none;
    border-bottom: 1px solid rgba(94, 234, 212, .25);
    margin-left: 18px;
  }
  .brand-right a:first-child { margin-left: 0; }
  .brand-right a:hover { color: #a7f3d0; border-bottom-color: #5eead4; }
  .brand-right .sep { color: #1a3a45; margin: 0 0 0 18px; }

  #main-container {
    position: absolute;
    top: 50%; left: 50%;
    width: 280px; height: 280px;
    margin: -140px 0 0 -140px;
    z-index: 1;
    text-align: center;
    background: rgba(8, 18, 24, .85);
    border: 1px solid #1a3a45;
    box-shadow: 0 0 40px rgba(0, 40, 50, .45), inset 0 0 0 1px rgba(0, 212, 232, .08);
  }
  body.done #main-container {
    border-color: #1a5a48;
    box-shadow: 0 0 40px rgba(52, 211, 153, .18), inset 0 0 0 1px rgba(52, 211, 153, .2);
  }
  body.fail #main-container {
    border-color: #5a1a1a;
    box-shadow: 0 0 40px rgba(248, 113, 113, .18), inset 0 0 0 1px rgba(248, 113, 113, .2);
  }

  #visual-indicator {
    position: relative;
    width: 80px; height: 80px;
    margin: 56px auto 0;
  }
  .pulse {
    position: absolute; top: 0; left: 0;
    width: 74px; height: 74px;
    border-radius: 50%;
    border: 3px solid #1a4a55;
    animation: subtle-pulse 2s infinite;
  }
  .core {
    position: absolute; top: 50%; left: 50%;
    width: 32px; height: 32px;
    margin: -16px 0 0 -16px;
    background: #00d4e8;
    border-radius: 50%;
    box-shadow: 0 0 15px #00d4e8;
  }
  #spin {
    position: absolute; top: -16px; left: -16px;
    width: 106px; height: 106px;
    border: 3px solid transparent;
    border-top-color: #e8f7fc;
    border-radius: 50%;
    animation: real-spin .8s linear infinite;
    opacity: .3;
  }
  body.done .pulse { border-color: #34d399; animation: none; }
  body.done .core { background: #34d399; box-shadow: 0 0 25px #34d399; }
  body.done #spin { opacity: 0; }
  body.fail .pulse { border-color: #f87171; animation: none; }
  body.fail .core { background: #f87171; box-shadow: 0 0 25px #f87171; }
  body.fail #spin { opacity: 0; }

  #status-label {
    margin-top: 28px;
    font-size: 14px; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase;
    color: #f0d060;
    animation: pulse 1.6s ease-in-out infinite;
  }
  #status-label .ready,
  #status-label .failed { display: none; }
  body.done #status-label {
    color: #34d399;
    animation: none;
  }
  body.done #status-label .working { display: none; }
  body.done #status-label .ready { display: inline; }
  body.fail #status-label {
    color: #f87171;
    animation: none;
  }
  body.fail #status-label .working { display: none; }
  body.fail #status-label .failed { display: inline; }

  #msg {
    display: none;
    margin-top: 10px;
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #f87171;
  }
  body.fail #msg { display: block; }

  #wrap { display: none; }
  #state, #out { display: none; }

  body.log { overflow: auto; height: auto; }
  body.log::after { display: none; }
  body.log #main-container { display: none; }
  body.log #wrap {
    display: block;
    position: relative; z-index: 1;
    padding: 18px 20px;
  }
  body.log #state {
    display: block;
    font-size: 20px; font-weight: 700; margin: 0 0 12px;
    letter-spacing: .08em; text-transform: uppercase;
    color: #e8f7fc;
  }
  body.log #state.warn { color: #f0d060; animation: pulse 1.6s ease-in-out infinite; }
  body.log #out {
    display: block;
    white-space: pre-wrap;
    font: 12px/1.5 Consolas, "Courier New", monospace;
    background: rgba(6, 14, 20, .92);
    border: 1px solid #1a3a45;
    border-left: 3px solid #00d4e8;
    padding: 12px 14px;
    height: calc(100vh - 160px);
    overflow-y: auto;
    color: #9ec4d4;
    box-shadow: inset 0 0 40px rgba(0, 40, 50, .35);
  }

  .ok { color: #34d399; }
  .bad { color: #f87171; }
  .warn { color: #f0d060; }
  .safe { color: #34d399; }
  .danger { color: #f87171; }
  code { color: #5eead4; font-family: Consolas, "Courier New", monospace; }
</style>
</head>
